name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      create_github_release:
        description: 'Publish as a GitHub Release (requires tag or release flag)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Prepare Environment File (.env)
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          # If secret GEMINI_API_KEY is available in repository secrets, write to .env
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            sed -i '/GEMINI_API_KEY=/d' .env
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi

      - name: Configure Android Signing Keystore
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secret KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
            echo "USING_CUSTOM_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "No custom KEYSTORE_BASE64 secret found. Generating CI release keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "upload" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ secrets.STORE_PASSWORD || 'android' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'android' }}" \
              -dname "CN=DevPrep CI, OU=Mobile, O=DevPrep, L=MountainView, S=CA, C=US"
            echo "USING_CUSTOM_KEYSTORE=false" >> $GITHUB_ENV
          fi
          
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Unit & JVM Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK (if requested)
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Identify and Tag APK Artifacts
        id: apk-info
        run: |
          APK_DIR="app/build/outputs/apk/release"
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            APK_DIR="app/build/outputs/apk/debug"
          fi
          
          APK_FILE=$(find "$APK_DIR" -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename $APK_FILE)" >> $GITHUB_OUTPUT
          else
            echo "Error: No APK found in $APK_DIR"
            exit 1
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devprep-${{ github.event.inputs.build_type || 'release' }}-apk
          path: ${{ steps.apk-info.outputs.apk_path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_github_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk-info.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
